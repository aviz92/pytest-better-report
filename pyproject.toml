[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-template-repository"
version = "0.0.1"
description = "A Python development template repository with CLI tools and best practices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Avi Zaguri" },]

keywords = [
    "development",
    "python",
    "template",
]

classifiers = [
    # "Development Status :: 5 - Production/Stable",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "custom-python-logger>=4.1.0",
    "pydantic-settings>=2.15.0",
    "python-base-command",
    "pytest-plugins",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "setuptools>=84.0.0",
    "wheel>=0.45.1",
]

[project.urls]
Homepage = "https://github.com/aviz92/dev-template-repository"
Repository = "https://github.com/aviz92/dev-template-repository"
Issues = "https://github.com/aviz92/dev-template-repository/issues"

[tool.setuptools.packages.find]
where = ["."]
# include = ["dev_template_repository*"]
namespaces = false

[project.scripts]  # must using "uv sync --group dev" or "uv pip install -e ." first
clean_pycache = "scripts.clean_pycache.command:main"
fetch_pypi_packages = "scripts.fetch_pypi_packages.command:main"
check_deps_versions = "scripts.check_deps_versions.command:main"
clean_migrations = "scripts.django.clean_migrations.command:main"
run_pytest_marker = "scripts.ci.run_pytest_marker:main"
