[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-better-report"
version = "1.0.3"
description = "A pytest plugin that writes structured JSON (and optional Markdown) reports of every run, with CI metadata and a CLI to compare two runs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Avi Zaguri" },]

keywords = [
    "pytest",
    "plugin",
    "testing",
    "report",
    "json",
    "markdown",
    "ci",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "custom-python-logger>=4.2.0",
    "pytest>=9.2.0",
    "python-base-command>=1.0.0",
    "python-base-toolkit>=1.2.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]

[project.urls]
Homepage = "https://github.com/aviz92/pytest-better-report"
Repository = "https://github.com/aviz92/pytest-better-report"
Issues = "https://github.com/aviz92/pytest-better-report/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytest_better_report*"]
namespaces = false

[project.entry-points.pytest11]
better_report = "pytest_better_report.plugin"

[project.scripts]
better_report_compare = "pytest_better_report.compare:main"
