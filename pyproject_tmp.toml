[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "<place-holder>"
version = "0.0.1"
description = "<place-holder>"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Avi Zaguri" },]

keywords = [
    "development",
    "python",
    "<place-holder>"
]

classifiers = [
    # "Development Status :: 5 - Production/Stable",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "custom-python-logger",
    "python-base-command",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "python-dotenv>=1.2.2",
    "setuptools>=82.0.1",
    "wheel>=0.45.1",
]

[project.urls]
Homepage = "https://github.com/aviz92/<place-holder>"
Repository = "https://github.com/aviz92/<place-holder>"
Issues = "https://github.com/aviz92/<place-holder>/issues"

[tool.setuptools.packages.find]
where = ["."]
# include = ["<place-holder>*"]
namespaces = false

[project.scripts]  # must using "uv sync --group dev" or "uv pip install -e ." first
clean_pycache = "scripts.clean_pycache.command:main"
fetch_pypi_packages = "scripts.fetch_pypi_packages.command:main"
clean_migrations = "scripts.django.clean_migrations.command:main"
run_pytest_marker = "scripts.ci.run_pytest_marker:main"
